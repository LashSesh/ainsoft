[package]
name = "ainsoft"
version = "0.1.0"
edition = "2021"
authors = ["AinSOFT Team"]
description = "Universal research framework for Web3 resonance networks and mesh topology analysis"
license = "MIT"
readme = "README.md"
keywords = ["web3", "research", "mesh", "topology", "resonance"]
categories = ["science", "cryptography"]

[lib]
name = "ainsoft"
path = "src/lib.rs"

[[bin]]
name = "ainsoft"
path = "src/main.rs"

[dependencies]
# Core
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Cryptography & Hashing
sha2 = "0.10"
hex = "0.4"
thiserror = "1.0"

# Numerical computing
nalgebra = "0.32"
rand = "0.8"

# CLI & Logging
clap = { version = "4.4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Networking
reqwest = { version = "0.11", features = ["json", "socks"] }
uuid = { version = "1.6", features = ["v4"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Optional: Web API
axum = { version = "0.7", optional = true }
tower = { version = "0.4", optional = true }

[features]
default = ["api"]
api = ["axum", "tower"]

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.9"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
