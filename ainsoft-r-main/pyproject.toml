[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ainsoft"
version = "0.1.0"
description = "AinSOFT – Celestial Resonance Impulse Engine"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "AinSOFT Contributors"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "click>=8.1",
    "fastapi>=0.110",
    "uvicorn>=0.23",
    "numpy>=1.24",
    "PySocks>=1.7",
    "PyYAML>=6.0",
    "pydantic>=1.10,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "httpx>=0.26",
]
mesh = [
    "scipy>=1.11",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["ainsoft*" ]
